<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">building-with-claude</title>
  <desc id="d">Banner for building-with-claude: an engineering journal on building software with Claude Code and AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e0f"/>
      <stop offset="1" stop-color="#171718"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>

  <!-- node-and-edge motif: a loop of plan -> build -> test -> refine -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2">
    <path d="M930 90 L1040 90 L1100 170 L1040 250 L930 250 L870 170 Z"/>
    <path d="M930 90 L1100 170 M1040 90 L870 170 M1040 250 L870 170 M930 250 L1100 170" stroke-opacity="0.07"/>
  </g>
  <g>
    <circle cx="930" cy="90" r="5" fill="#2a2a2c" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="1040" cy="90" r="5" fill="#2a2a2c" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="1100" cy="170" r="5" fill="#2a2a2c" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="1040" cy="250" r="5" fill="#2a2a2c" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="930" cy="250" r="5" fill="#2a2a2c" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="870" cy="170" r="5" fill="#2a2a2c" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="985" cy="170" r="9" fill="#d97757"/>
    <circle cx="985" cy="170" r="20" fill="none" stroke="#d97757" stroke-opacity="0.35"/>
    <circle cx="985" cy="170" r="34" fill="none" stroke="#d97757" stroke-opacity="0.15"/>
  </g>

  <!-- wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="72" y="104" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" letter-spacing="3.5" fill="#d97757">ENGINEERING JOURNAL</text>
    <text x="72" y="178" font-size="68" fill="#f4f1ea" letter-spacing="-1.5">building<tspan fill="#d97757">&#8209;</tspan>with<tspan fill="#d97757">&#8209;</tspan>claude</text>
  </g>
  <rect x="72" y="204" width="360" height="2" fill="url(#rule)"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#a8a49b">
    <text x="72" y="246" font-size="19">How I build software with Claude Code and AI agents,</text>
    <text x="72" y="274" font-size="19">and what I am learning along the way.</text>
  </g>
  <text x="72" y="316" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#6f6c66">OTHMAN CHAFIK  /  INDUSTRIAL ENGINEER  /  INDEPENDENT BUILDER</text>
</svg>
